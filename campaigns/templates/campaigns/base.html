<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}מערכת קמפיינים{% endblock %} | Arye Textile</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #7594B1;
            --blue-light: #A9BCCE;
            --bg: #F5F5F5;
            --text: #333;
            --green: #3d9970;
            --red: #d9534f;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Heebo', Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--blue); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        header .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        header a { color: #fff; text-decoration: none; margin-inline-start: 16px; font-size: 15px; }
        header a:hover { text-decoration: underline; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.07); margin-bottom: 20px; }
        h1 { font-size: 26px; margin: 0 0 20px; color: var(--blue); }
        h2 { font-size: 19px; color: var(--blue); }
        .btn { display: inline-block; background: var(--blue); color: #fff; border: none; border-radius: 6px;
               padding: 10px 26px; font-size: 15px; font-family: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #62809c; }
        .btn.secondary { background: var(--blue-light); }
        .btn.danger { background: var(--red); }
        .btn.small { padding: 6px 14px; font-size: 13px; }
        form p { margin: 0 0 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input[type=text], input[type=email], input[type=password], textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px;
        }
        textarea { resize: vertical; }
        .helptext { display: block; color: #777; font-size: 13px; margin-top: 4px; }
        .messages { list-style: none; padding: 0; margin: 0 0 20px; }
        .messages li { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
        .messages li.success { background: #e6f4ee; color: var(--green); }
        .messages li.error { background: #fdecea; color: var(--red); }
        .messages li.warning { background: #fff6e0; color: #9a7b1d; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { color: var(--blue); font-size: 13px; }
        .tag { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .tag.pending { background: #eee; color: #666; }
        .tag.sent { background: #e6f4ee; color: var(--green); }
        .tag.failed { background: #fdecea; color: var(--red); }
        .tag.draft { background: #eee; color: #666; }
        .tag.sending { background: #fff6e0; color: #9a7b1d; }
        .tag.done { background: #e6f4ee; color: var(--green); }
        .tag.new { background: #eee; color: #666; }
        .tag.contacted { background: #e8eef5; color: var(--blue); }
        .tag.replied { background: #e6f4ee; color: var(--green); }
        .tag.in_talks { background: #fff6e0; color: #9a7b1d; }
        .tag.customer { background: #e6f4ee; color: var(--green); }
        .tag.not_interested { background: #fdecea; color: var(--red); }
        .tag.repeat { background: #fff6e0; color: #9a7b1d; }
        .tag.first { background: #e8eef5; color: var(--blue); }
        .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
        .stat { background: #fff; border-radius: 10px; padding: 14px 22px; box-shadow: 0 2px 8px rgba(0,0,0,.07); text-align: center; min-width: 110px; }
        .stat .num { font-size: 26px; font-weight: 700; color: var(--blue); }
        .stat .lbl { font-size: 13px; color: #777; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
        iframe.preview { width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        .errcell { color: var(--red); font-size: 12px; max-width: 260px; word-break: break-word; }
    </style>
</head>
<body>
<header>
    <div class="brand">ARYE TEXTILE | מערכת קמפיינים</div>
    <nav>
        <a href="{% url 'campaign_list' %}">כל הקמפיינים</a>
        <a href="{% url 'campaign_create' %}">קמפיין חדש</a>
        <a href="{% url 'contact_list' %}">לקוחות</a>
        <a href="{% url 'admin:index' %}">ניהול האתר</a>
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'admin:logout' %}" style="display:inline">{% csrf_token %}
            <button type="submit" style="background:none;border:none;color:#fff;cursor:pointer;font-family:inherit;font-size:15px;margin-inline-start:16px;text-decoration:underline">יציאה</button>
        </form>
        {% endif %}
    </nav>
</header>
<main>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
