{% extends "campaigns/base.html" %}
{% block title %}התחברות{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
    <h1>התחברות</h1>
    {% if form.errors %}<p style="color:var(--red);font-weight:600">שם משתמש או סיסמה שגויים.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <p><label>שם משתמש</label>{{ form.username }}</p>
        <p><label>סיסמה</label>{{ form.password }}</p>
        <button type="submit" class="btn" style="width:100%">כניסה</button>
    </form>
</div>
{% endblock %}
